name: CI (mcp-combiner)

on:
  push:
    branches: [main, dev]
    paths: ["combiner/**", "lua/**", "tests/**", "scripts/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["combiner/**", "lua/**", "tests/**", "scripts/**", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combiner
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Neovim so the real-editor tests (test_nvim_channel, test_nvim_e2e)
      # run instead of silently skipping.
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Install (project + dev group, from uv.lock)
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy mcp_combiner

      - name: Tests — fast tier
        run: uv run pytest -q -m "not e2e"

      - name: Tests — e2e tier
        # Spawns real combiner + mock subprocesses. sharedserver-backed tests
        # skip automatically (binary not installed in CI).
        run: uv run pytest -q -m "e2e"

  lua-tests:
    # Self-contained Lua tests only (no combiner/CodeCompanion/network needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Lua tests (headless)
        run: scripts/test-lua.sh
