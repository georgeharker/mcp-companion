name: CI (mcp-combiner)

on:
  push:
    branches: [main, dev]
    paths: ["combiner/**", "lua/**", "tests/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["combiner/**", "lua/**", "tests/**", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: combiner
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install (project + dev group, from uv.lock)
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy mcp_combiner

      - name: Tests (pytest)
        run: uv run pytest -q

  lua-tests:
    # Self-contained Lua tests only (no combiner/CodeCompanion/network needed).
    # Each test calls `cq` on failure, so a non-zero exit fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Lua tests (headless)
        run: |
          set -e
          for t in tests/test_schema.lua tests/test_native.lua; do
            echo "== $t =="
            nvim --headless --noplugin -u NONE -c "set rtp+=$PWD" -c "luafile $t"
          done
